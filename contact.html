<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
  <title>yusikpark</title>
  <meta name="description" content="yusikpark — Visual designer and art director based in Tokyo.">
  <!-- ちらつき防止：表示前にライト/ダークと言語を反映 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("lang");
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="contact">
  <!-- 左テキスト＋右上メニューは js/main.js が全ページ共通で描画 -->
  <div id="site-chrome"></div>

    <main>
    <!-- 中身は js/main.js が言語に合わせて描画します -->
    <div class="contact" id="contact"></div>
  </main>
</body>
</html>
