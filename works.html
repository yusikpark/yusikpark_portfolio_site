<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
  <title>WORKS - yusikpark</title>
  <meta name="description" content="yusikpark — Visual designer and art director based in Tokyo.">
  <!-- ちらつき防止：表示前にライト/ダークと言語を反映 -->
    <!-- favicon -->
    <!-- favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- 正式なURL（.htmlあり・なしの重複を防ぐ） ★ -->
  <link rel="canonical" href="https://yusikpark.com/works">

  <!-- OGP -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="yusikpark">
  <meta property="og:title" content="WORKS — yusikpark">          <!-- ★ -->
  <meta property="og:description" content="Graphic designer and art director based in Tokyo.">
  <meta property="og:url" content="https://yusikpark.com/works">  <!-- ★ -->
  <meta property="og:image" content="https://yusikpark.com/images/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("lang");
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/works.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="works">
  <!-- 左テキスト＋右上メニューは js/main.js が全ページ共通で描画 -->
  <div id="site-chrome"></div>

    <main>
    <!-- 作品を追加するときは <li class="work-card"> 〜 </li> を1つ複製して書き換える -->
    <ul class="works-grid">
      <li class="work-card">
        <a href="work-mayuwakamatsu_businesscard">
                    <div class="work-thumb"><img src="images/works/mayuwakamatsu_businesscard/thumb.jpg" alt="Mayu Wakamatsu Business Card" loading="lazy"></div>
          <p class="work-caption" data-work="work-mayuwakamatsu_businesscard"></p>
        </a>
      </li>

      <li class="work-card">
        <a href="work-Liberté">
                    <div class="work-thumb"><img src="images/works/Liberté/thumb.jpg" alt="Liberté" loading="lazy"></div>
          <p class="work-caption" data-work="work-Liberté"></p>
        </a>
      </li>

      <li class="work-card">
        <a href="work-CMZ">
                    <div class="work-thumb"><img src="images/works/CMZ/thumb.jpg" alt="CMZ Logo" loading="lazy"></div>
          <p class="work-caption" data-work="work-CMZ"></p>
        </a>
      </li>

      <li class="work-card">
        <a href="work-A-SCENE">
          <!-- 画像を入れたら、下の1行を次の行に差し替え：
               <div class="work-thumb"><img src="images/works/01/thumb.jpg" alt="Project name" loading="lazy"></div> -->
                    <div class="work-thumb"><img src="images/works/A-SCENE/thumb.jpg" alt="A SCENE" loading="lazy"></div>
                    <p class="work-caption" data-work="work-A-SCENE"></p>
        </a>
      </li>
      <li class="work-card">
        <a href="work-GAME-vol.1">
                    <div class="work-thumb"><img src="images/works/GAME-vol.1/thumb.jpg" alt="GAME vol.1" loading="lazy"></div>
          <p class="work-caption" data-work="work-GAME-vol.1"></p>
        </a>
      </li>

    </ul>
  </main>
</body>
</html>
