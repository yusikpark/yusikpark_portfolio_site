<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
  <title>yusikpark</title>
  <meta name="description" content="yusikpark — Visual designer and art director based in Tokyo.">
    <!-- favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- OGP（SNSで共有したときの表示） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="yusikpark">
  <meta property="og:title" content="yusikpark">
  <meta property="og:description" content="Visual designer and art director based in Tokyo.">
  <meta property="og:url" content="https://yusikpark.com/">
  <meta property="og:image" content="https://yusikpark.com/images/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- ちらつき防止：表示前にライト/ダークと言語を反映 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("lang");
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="top">
  <!-- 左テキスト＋右上メニューは js/main.js が全ページ共通で描画 -->
  <div id="site-chrome"></div>

    <main>
    <!-- TOPの大きな名前（1文字ずつのホバー用に js/main.js が分割します） -->
    <h1 class="hero-name" data-split>yusikpark</h1>
  </main>
</body>
</html>
